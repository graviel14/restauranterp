<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Richeese Factory ERP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-ic">🍽️</div>
        <div><b>Richeese Factory ERP</b><small id="brand-resto">Integrated</small></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <div id="conn" class="conn"><i></i><span>Local mode</span></div>
        <button class="btn ghost sm" id="btn-reset" title="Clear all data & load demo dataset">Reset demo data</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="btn-menu">☰</button>
        <div>
          <h1 id="page-title">Dashboard</h1>
          <p id="page-sub" class="muted"></p>
        </div>
        <div class="top-right">
          <span class="live"><i></i> LIVE</span>
          <span id="clock" class="clock"></span>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toasts"></div>

  <!-- jsPDF for PDF documents (requires internet; falls back to print window if offline) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/pos.js"></script>
  <script src="js/views/kds.js"></script>
  <script src="js/views/queue.js"></script>
  <script src="js/views/orders.js"></script>
  <script src="js/views/shift.js"></script>
  <script src="js/views/stock.js"></script>
  <script src="js/views/opname.js"></script>
  <script src="js/views/upselling.js"></script>
  <script src="js/views/receive.js"></script>
  <script src="js/views/issue.js"></script>
  <script src="js/views/waste.js"></script>
  <script src="js/views/variance.js"></script>
  <script src="js/views/sales.js"></script>
  <script src="js/views/integrations.js"></script>
  <script src="js/views/master.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
